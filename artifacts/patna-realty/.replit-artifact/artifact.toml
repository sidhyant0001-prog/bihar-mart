kind = "web"
previewPath = "/"
title = "Patna Realty Manager"
version = "1.0.0"
id = "artifacts/patna-realty"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25076

[services.development]
run = "pnpm --filter @workspace/patna-realty run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/patna-realty", "run", "build" ]
publicDir = "artifacts/patna-realty/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25076"
BASE_PATH = "/"
